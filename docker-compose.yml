# -----------------------------------------------------------------------------------------------------------------------
#  Configure image labels
# -----------------------------------------------------------------------------------------------------------------------
x-build-labels: &build_labels
  org.opencontainers.image.authors: "admin@magenx.com"
  org.opencontainers.image.source: "https://github.com/magenx/Magento-2-docker-configuration"

# -----------------------------------------------------------------------------------------------------------------------
#  Configure logger driver
# -----------------------------------------------------------------------------------------------------------------------
x-logger: &logger
  logging:
    driver: syslog
    options:
      syslog-address: "unixgram:///dev/log"
      mode: non-blocking
      tag: "[ {{.Name}} ]"

# -----------------------------------------------------------------------------------------------------------------------
#  Configure ulimits
# -----------------------------------------------------------------------------------------------------------------------
x-ulimits: &ulimits
  ulimits:
    memlock:
      soft: -1
      hard: -1
    nofile:
      soft: 65536
      hard: 65536

# -----------------------------------------------------------------------------------------------------------------------
#  Configure healthcheck
# -----------------------------------------------------------------------------------------------------------------------
x-healthcheck_default: &healthcheck_default
  start_period: ${HEALTHCHECK_START_PERIOD}
  interval: ${HEALTHCHECK_INTERVAL}
  timeout: ${HEALTHCHECK_TIMEOUT}
  retries: ${HEALTHCHECK_RETRIES}

# -----------------------------------------------------------------------------------------------------------------------
#  Configure hardening params
# -----------------------------------------------------------------------------------------------------------------------
x-hardening: &hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 1024

# -----------------------------------------------------------------------------------------------------------------------
#  Services configuration parameters
# -----------------------------------------------------------------------------------------------------------------------
services:

# -----------------------------------------------------------------------------------------------------------------------
#  MariaDB is a high performing open source relational database
# -----------------------------------------------------------------------------------------------------------------------
  mariadb:
    container_name: mariadb
    hostname: mariadb
    image: ${IMAGE_REGISTRY:?}/${BRAND:?}-mariadb:${IMAGE_TAG:?}
    build:
      context: ./mariadb
      labels:
        <<: *build_labels
      args:
        MARIADB_IMAGE:
        MARIADB_DEV_IMAGE:
    environment:
      MARIADB_AUTO_UPGRADE:
      MARIADB_DISABLE_UPGRADE_BACKUP:
      MARIADB_ROOT_PASSWORD:
      MARIADB_DATABASE:
      MARIADB_USER:
      MARIADB_PASSWORD:
      TIMEZONE:
    expose:
      - "${MARIADB_PORT}"
    ports:
      - "127.0.0.1:${MARIADB_PORT}:${MARIADB_PORT}"
    networks:
      - backend
    volumes:
      - mariadb:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized", "--innodb_buffer_pool_loaded"]
      <<: *healthcheck_default
    tmpfs:
      - /tmp:uid=${DHI_STACK_UID},gid=${DHI_STACK_UID},mode=1770
      - /run/mariadb:uid=${DHI_STACK_UID},gid=${DHI_STACK_UID},mode=0750
    <<: [*ulimits, *logger, *hardening]

# -----------------------------------------------------------------------------------------------------------------------
#  Opensearch is a powerful open source search and analytics engine
# -----------------------------------------------------------------------------------------------------------------------
  opensearch:
    container_name: opensearch
    hostname: opensearch
    image: ${IMAGE_REGISTRY:?}/${BRAND:?}-opensearch:${IMAGE_TAG:?}
    build:
      context: ./opensearch
      labels:
        <<: *build_labels
      args:
        OPENSEARCH_IMAGE:
        OPENSEARCH_DEV_IMAGE:
        OPENSEARCH_CERT_DAYS:
        BRAND:
        DHI_STACK_UID:
      secrets:
        - opensearch_admin_password
    develop:
      watch:
        - path: ./opensearch
          action: rebuild
    environment:
      - cluster.name=${BRAND}-cluster
      - node.name=${BRAND}-node1
      - node.attr.rack=${BRAND}-rack1
      - discovery.type=single-node
      - cluster.routing.allocation.enable=all
      - bootstrap.memory_lock=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=${OPENSEARCH_XMS} ${OPENSEARCH_XMX}
    expose:
      - "${OPENSEARCH_PORT}"
    networks:
      - frontend
    volumes:
      - opensearch:/usr/share/opensearch/data
      - opensearch-logs:/usr/share/opensearch/logs
    user: "${DHI_STACK_UID}:${DHI_STACK_UID}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u 'admin:${OPENSEARCH_ADMIN_PASSWORD:?missing, load .env.secrets}' 'http://opensearch:${OPENSEARCH_PORT}/_cluster/health' || exit 1"]
      <<: *healthcheck_default
    tmpfs:
      - /tmp:exec,uid=${DHI_STACK_UID},gid=${DHI_STACK_UID},mode=1770
    <<: [*ulimits, *logger, *hardening]

# -----------------------------------------------------------------------------------------------------------------------
#  Valkey is an open source key-value store that functions as a data structure server.
# -----------------------------------------------------------------------------------------------------------------------
  cache:
    container_name: cache
    hostname: cache
    image: ${IMAGE_REGISTRY:?}/${BRAND:?}-cache:${IMAGE_TAG:?}
    build: &valkey_build
      context: ./valkey
      target: cache
      labels:
        <<: *build_labels
      args:
        VALKEY_IMAGE:
    command:
      - /cache.conf
      - --bind
      - cache
      - --port
      - "${VALKEY_CACHE_PORT}"
      - --maxmemory
      - "${VALKEY_CACHE_SIZE}"
      - --requirepass
      - "${VALKEY_PASSWORD:?missing, load .env.secrets}"
    expose:
      - "${VALKEY_CACHE_PORT}"
    networks:
      - frontend
    volumes:
      - valkey-cache:/data
    restart: unless-stopped
    mem_limit: ${VALKEY_CACHE_SIZE}
    healthcheck:
      test: ["CMD", "valkey-cli", "-h", "cache", "-p", "${VALKEY_CACHE_PORT}", "-a", "${VALKEY_PASSWORD:?missing, load .env.secrets}", "ping"]
      <<: *healthcheck_default
    tmpfs:
      - /tmp:uid=${DHI_STACK_UID},gid=${DHI_STACK_UID},mode=1770
    <<: [*ulimits, *logger, *hardening]

# -----------------------------------------------------------------------------------------------------------------------
#  Valkey is an open source key-value store that functions as a data structure server.
# -----------------------------------------------------------------------------------------------------------------------
  session:
    container_name: session
    hostname: session
    image: ${IMAGE_REGISTRY:?}/${BRAND:?}-session:${IMAGE_TAG:?}
    build:
      <<: *valkey_build
      target: session
    command:
      - /session.conf
      - --bind
      - session
      - --port
      - "${VALKEY_SESSION_PORT}"
      - --maxmemory
      - "${VALKEY_SESSION_SIZE}"
      - --requirepass
      - "${VALKEY_PASSWORD:?missing, load .env.secrets}"
    expose:
      - "${VALKEY_SESSION_PORT}"
    networks:
      - frontend
    volumes:
      - valkey-session:/data
    restart: unless-stopped
    mem_limit: ${VALKEY_SESSION_SIZE}
    healthcheck:
      test: ["CMD", "valkey-cli", "-h", "session", "-p", "${VALKEY_SESSION_PORT}", "-a", "${VALKEY_PASSWORD:?missing, load .env.secrets}", "ping"]
      <<: *healthcheck_default
    tmpfs:
      - /tmp:uid=${DHI_STACK_UID},gid=${DHI_STACK_UID},mode=1770
    <<: [*ulimits, *logger, *hardening]

# -----------------------------------------------------------------------------------------------------------------------
#  RabbitMQ is an open source multi-protocol messaging broker
# -----------------------------------------------------------------------------------------------------------------------                
  rabbitmq:
    container_name: rabbitmq
    hostname: rabbitmq
    image: ${IMAGE_REGISTRY:?}/${BRAND:?}-rabbitmq:${IMAGE_TAG:?}
    build:
      context: ./rabbitmq
      labels:
        <<: *build_labels
      args:
        RABBITMQ_IMAGE:
    environment:
      RABBITMQ_DEFAULT_USER: ${BRAND}
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?missing, load .env.secrets}"
      RABBITMQ_DEFAULT_VHOST: ${BRAND}
      RABBITMQ_ENABLED_PLUGINS_FILE: /enabled_plugins
    expose:
      - "${RABBITMQ_PORT}"
      - "${RABBITMQ_MANAGE_PORT}"
    networks:
      - frontend
    volumes:
      - rabbitmq:/var/lib/rabbitmq
      - rabbitmq-logs:/var/log/rabbitmq
    restart: unless-stopped
    mem_limit: 1G
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      <<: *healthcheck_default
    tmpfs:
      - /tmp:uid=${DHI_STACK_UID},gid=${DHI_STACK_UID},mode=1770
    <<: [*ulimits, *logger, *hardening]

# -----------------------------------------------------------------------------------------------------------------------
#  Varnish is an HTTP accelerator designed for content-heavy dynamic web sites as well as APIs.
# -----------------------------------------------------------------------------------------------------------------------                  
  varnish:
    container_name: varnish
    hostname: varnish
    image: ${IMAGE_REGISTRY:?}/${BRAND:?}-varnish:${IMAGE_TAG:?}
    build:
      context: ./varnish
      labels:
        <<: *build_labels
      args:
        VARNISH_IMAGE:
        VARNISH_DEV_IMAGE:
        VARNISH_SIZE:
        TIMEZONE:
    develop:
      watch:
        - path: ./varnish
          action: rebuild
    environment:
      DOMAIN:
      PROFILER:
    depends_on:
      - nginx
      - php
    ports:
      - "${HOST_PRIVATE_IP}:${HOST_PRIVATE_PORT}:${VARNISH_PORT}"
    networks:
      - frontend
    tmpfs:
      - /var/lib/varnish/varnishd:exec,uid=${DHI_STACK_UID},gid=${DHI_STACK_UID},mode=1770,size=256m
    command:
      - -F
      - -a 
      - varnish:80
      - -T 
      - varnish:6082
      - -f 
      - /etc/varnish/default.vcl
      - -S 
      - /etc/varnish/secret
      - -s 
      - malloc,${VARNISH_SIZE}
      - -I 
      - /etc/varnish/varnish_params
    restart: unless-stopped
    mem_limit: ${VARNISH_SIZE}
    healthcheck:
      test: ["CMD", "varnishadm", "ping"]
      <<: *healthcheck_default
    <<: [*ulimits, *logger, *hardening]

# -----------------------------------------------------------------------------------------------------------------------
#  Configure container to run php and php-fpm
# -----------------------------------------------------------------------------------------------------------------------    
  php:
    container_name: php
    hostname: php
    image: ${IMAGE_REGISTRY:?}/${BRAND:?}-php:${IMAGE_TAG:?}
    build:
      context: ./php
      target: php
      labels:
        <<: *build_labels
      args: &php_magento_args
        PHP_DEV_IMAGE:
        PHP_FPM_IMAGE:
        PHP_IMAGE:
        PHP_EXTENSION:
        PHP_FPM:
        PHP_FPM_PORT:
        PIE_IMAGE:
        PIE_MODULES:
        BUSYBOX_IMAGE:
        COMPOSER_IMAGE:
        BRAND:
        DOMAIN:
        ADMIN_PATH:
        MAGENTO_ROOT_PATH:
        DHI_STACK_UID:
        TIMEZONE:
        CURRENT_SYMLINK:
    develop:
      watch:
        - path: ./php
          action: rebuild
    environment: &php_magento_env
      MARIADB_DATABASE:
      MARIADB_USER:
      MARIADB_PASSWORD:
      RABBITMQ_PASSWORD:
      VALKEY_PASSWORD:
      OPENSEARCH_PASSWORD:
      BRAND:
      DOMAIN:
      MAGENTO_ROOT_PATH:
      ADMIN_PATH:
      CRYPT_KEY:
      CURRENT_SYMLINK:
      GRAPHQL_ID_SALT:
    depends_on:
      mariadb:
        condition: service_healthy
    expose:
      - "${PHP_FPM_PORT}"
    networks:
      - backend
      - frontend
    volumes:
      - ${MAGENTO_ROOT_PATH}/public:${MAGENTO_ROOT_PATH}/public:ro
      - ${MAGENTO_ROOT_PATH}/releases:${MAGENTO_ROOT_PATH}/releases:ro
      - ${MAGENTO_ROOT_PATH}/shared/var:${MAGENTO_ROOT_PATH}/shared/var
      - ${MAGENTO_ROOT_PATH}/shared/pub/media:${MAGENTO_ROOT_PATH}/shared/pub/media
    working_dir: "${MAGENTO_ROOT_PATH}/${CURRENT_SYMLINK}"
    entrypoint: ["php-fpm", "-F"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      <<: *healthcheck_default
    tmpfs:
      - /tmp:uid=${DHI_STACK_UID},gid=${DHI_STACK_UID},mode=1770
    <<: [*ulimits, *logger, *hardening]

# -----------------------------------------------------------------------------------------------------------------------
#  Configure container for magento app
# -----------------------------------------------------------------------------------------------------------------------    
  magento:
    container_name: magento
    image: ${IMAGE_REGISTRY:?}/${BRAND:?}-magento:${IMAGE_TAG:?}
    build:
      context: ./php
      target: magento
      labels:
        <<: *build_labels
      args:
        <<: *php_magento_args
    develop:
      watch:
        - path: ./magento
          action: rebuild
    environment:
      <<: *php_magento_env
      COMPOSER_MEMORY_LIMIT:
      COMPOSER_AUTH:
      COMPOSER_HOME: /tmp/composer
    volumes:
      - ${MAGENTO_ROOT_PATH}/public:${MAGENTO_ROOT_PATH}/public
      - ${MAGENTO_ROOT_PATH}/shared/var:${MAGENTO_ROOT_PATH}/shared/var
      - ${MAGENTO_ROOT_PATH}/shared/pub/media:${MAGENTO_ROOT_PATH}/shared/pub/media
      - ${MAGENTO_ROOT_PATH}/releases:${MAGENTO_ROOT_PATH}/releases
    working_dir: "${MAGENTO_ROOT_PATH}/${CURRENT_SYMLINK}"
    networks:
      - backend
      - frontend
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    tmpfs:
      - /tmp:uid=${DHI_STACK_UID},gid=${DHI_STACK_UID},mode=1770
    <<: [*ulimits, *logger, *hardening]

# -----------------------------------------------------------------------------------------------------------------------
#  Nginx is an open source reverse proxy server for HTTP, HTTPS
# -----------------------------------------------------------------------------------------------------------------------                   
  nginx:
    container_name: nginx
    hostname: nginx
    image: ${IMAGE_REGISTRY:?}/${BRAND:?}-nginx:${IMAGE_TAG:?}
    build:
      context: ./nginx
      labels:
        <<: *build_labels
      args:
        <<: *php_magento_args
        NGINX_IMAGE:
        NGINX_DEV_IMAGE:
        PROFILER:
        RESOLVER:
        RABBITMQ_PATH:
        ADMINER_PATH:
    develop:
      watch:
        - path: ./nginx
          action: rebuild
    depends_on:
      mariadb:
        condition: service_healthy
      php:
        condition: service_started
    expose:
      - "${NGINX_PORT}"
    networks:
      - frontend 
    volumes:
      - ${MAGENTO_ROOT_PATH}/public:${MAGENTO_ROOT_PATH}/public:ro
      - ${MAGENTO_ROOT_PATH}/shared/var:${MAGENTO_ROOT_PATH}/shared/var:ro
      - ${MAGENTO_ROOT_PATH}/shared/pub/media:${MAGENTO_ROOT_PATH}/shared/pub/media:ro
      - ${MAGENTO_ROOT_PATH}/releases:${MAGENTO_ROOT_PATH}/releases:ro
      - nginx-logs:/var/log/nginx
      - nginx-cache:/var/cache/nginx
    working_dir: "${MAGENTO_ROOT_PATH}/${CURRENT_SYMLINK}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      <<: *healthcheck_default
    tmpfs:
      - /tmp:uid=${DHI_STACK_UID},gid=${DHI_STACK_UID},mode=1770
    <<: [*ulimits, *logger, *hardening]

# -----------------------------------------------------------------------------------------------------------------------
#   Cron job scheduler run arbitrary commands, or "jobs", according to a schedule
# ----------------------------------------------------------------------------------------------------------------------- 
  cron:
    container_name: cron
    image: ${IMAGE_REGISTRY:?}/${BRAND:?}-cron:${IMAGE_TAG:?}
    build:
      context: ./php
      target: cron
      labels:
        <<: *build_labels
      args:
        <<: *php_magento_args
        SUPERCRONIC_SHA1SUM_AMD64:
        SUPERCRONIC_SHA1SUM_ARM64:
        SUPERCRONIC_URL:
    develop:
      watch:
        - path: ./php
          action: rebuild
    environment:
      <<: *php_magento_env
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - frontend
      - backend
    volumes:
      - ${MAGENTO_ROOT_PATH}/public:${MAGENTO_ROOT_PATH}/public:ro
      - ${MAGENTO_ROOT_PATH}/releases:${MAGENTO_ROOT_PATH}/releases:ro
      - ${MAGENTO_ROOT_PATH}/shared/var:${MAGENTO_ROOT_PATH}/shared/var
      - ${MAGENTO_ROOT_PATH}/shared/pub/media:${MAGENTO_ROOT_PATH}/shared/pub/media
    working_dir: "${MAGENTO_ROOT_PATH}/${CURRENT_SYMLINK}"
    entrypoint: ["/usr/local/bin/supercronic"]
    command: ["${MAGENTO_ROOT_PATH}/crontab"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/supercronic", "-test", "${MAGENTO_ROOT_PATH}/crontab"]
      <<: *healthcheck_default
    tmpfs:
      - /tmp:uid=${DHI_STACK_UID},gid=${DHI_STACK_UID},mode=1770
    <<: [*ulimits, *logger, *hardening]

# -----------------------------------------------------------------------------------------------------------------------
#   Fast and secure standalone server for resizing, processing, and converting images
# ----------------------------------------------------------------------------------------------------------------------- 
  imgproxy:
    image: ${IMGPROXY_IMAGE}
    container_name: imgproxy
    environment:
      IMGPROXY_ALLOW_INSECURE:
      IMGPROXY_ALLOWED_SOURCES:
      IMGPROXY_LOCAL_FILESYSTEM_ROOT:
      #IMGPROXY_FALLBACK_IMAGE_PATH:
      #IMGPROXY_WATERMARK_PATH:
      IMGPROXY_MAX_REDIRECTS:
      IMGPROXY_TTL:
      IMGPROXY_AUTO_WEBP:
      IMGPROXY_AUTO_AVIF:
      IMGPROXY_QUALITY:
      IMGPROXY_FORMAT_QUALITY:
      IMGPROXY_BIND:
      IMGPROXY_USE_ETAG:
      IMGPROXY_CONCURRENCY:
      IMGPROXY_TIMEOUT:
      IMGPROXY_READ_REQUEST_TIMEOUT:
      IMGPROXY_WRITE_RESPONSE_TIMEOUT:
      IMGPROXY_DOWNLOAD_TIMEOUT:
      IMGPROXY_ENABLE_DEBUG_HEADERS:
    depends_on:
      nginx:
         condition: service_started
    volumes:
      - ${MAGENTO_ROOT_PATH}/shared/pub/media:${MAGENTO_ROOT_PATH}/shared/pub/media:ro
    expose:
      - "${IMGPROXY_PORT}"
    networks:
      - frontend
    working_dir: "${MAGENTO_ROOT_PATH}/shared/pub/media"
    user: "${DHI_STACK_UID}:${DHI_STACK_UID}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      <<: *healthcheck_default
    tmpfs:
      - /tmp:uid=${DHI_STACK_UID},gid=${DHI_STACK_UID},mode=1770
    <<: [*ulimits, *logger, *hardening]


# -----------------------------------------------------------------------------------------------------------------------
#   Named networks list
# ----------------------------------------------------------------------------------------------------------------------- 
networks:
  frontend:
  backend:
  
# -----------------------------------------------------------------------------------------------------------------------
#   Named volumes
# ----------------------------------------------------------------------------------------------------------------------- 

volumes:
  mariadb:
  opensearch:
  opensearch-logs:
  valkey-session:
  valkey-cache:
  rabbitmq:
  rabbitmq-logs:
  nginx-cache:
  nginx-logs:

# -----------------------------------------------------------------------------------------------------------------------
#   Build secrets
# -----------------------------------------------------------------------------------------------------------------------

secrets:
  opensearch_admin_password:
    environment: OPENSEARCH_ADMIN_PASSWORD
