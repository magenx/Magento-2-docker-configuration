name: release

# release-please opens a release PR from conventional commits. Merging it creates a draft release and tag,
# then changed images are built with buildx bake, the stack is tested, new images are pushed to ghcr.io,
# the digests of all images are attached to the release as docker-compose.release.yml
# and the release is published (immutable when release immutability is on).
#
# Images are tagged by fingerprint (scripts/image_fingerprint.sh): an image whose inputs did not change
# keeps its tag and digest from an earlier release and is not rebuilt.
#
# Build runs only in repos with variable BUILD_IMAGES=true. It needs:
#   - .env with the shop settings and nginx/templates committed to the repo
#   - variable BUILD_RUNNER: runner with the server arch, default ubuntu-latest (amd64), ubuntu-24.04-arm for arm64
#   - variable BUILD_EPOCH (optional): bump it to rebuild all images, picks up unpinned apt and download updates
#   - secrets DHI_USER, DHI_PAT: dhi.io login
#   - secret BUILD_SECRETS: lines from the server .env.secrets that are baked into images:
#     OPENSEARCH_ADMIN_PASSWORD, ADMIN_PATH, RABBITMQ_PATH, ADMINER_PATH, PROFILER
#   all other passwords are throwaway values generated for the test run

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: .github/release/release-please-config.json
          manifest-file: .github/release/release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && vars.BUILD_IMAGES == 'true'
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
    env:
      IMAGE_TAG: ${{ needs.release-please.outputs.version }}
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
      BUILD_EPOCH: ${{ vars.BUILD_EPOCH || '0' }}
      COMPOSE_ENV_FILES: .env,.env.secrets
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image registry
        run: echo "IMAGE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Prepare .env.secrets
        env:
          BUILD_SECRETS: ${{ secrets.BUILD_SECRETS }}
        run: |
          test -f .env || { echo "::error::.env with the shop settings must be committed"; exit 1; }
          cp .env.secrets.template .env.secrets
          bash scripts/random_generator.sh
          # replace the generated values that end up in images with the real ones
          trap 'rm -f "$RUNNER_TEMP/build.secrets"' EXIT
          printf '%s\n' "$BUILD_SECRETS" | tr -d '\r' | grep -E '^[A-Z_]+=' > "$RUNNER_TEMP/build.secrets"
          while IFS= read -r line; do
            sed -i "/^${line%%=*}=/d" .env.secrets
          done < "$RUNNER_TEMP/build.secrets"
          cat "$RUNNER_TEMP/build.secrets" >> .env.secrets
          # every value baked into images must come from BUILD_SECRETS and be set;
          # report key names only, never values
          for key in OPENSEARCH_ADMIN_PASSWORD ADMIN_PATH RABBITMQ_PATH ADMINER_PATH PROFILER; do
            grep -q "^${key}=" "$RUNNER_TEMP/build.secrets" \
              || { echo "::error::BUILD_SECRETS must contain ${key}"; exit 1; }
            value=$(set -a; . ./.env.secrets; printf '%s' "${!key:-}")
            [ -n "${value}" ] || { echo "::error::${key} in BUILD_SECRETS has an empty value"; exit 1; }
          done

      - name: Login to dhi.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USER }}
          password: ${{ secrets.DHI_PAT }}

      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Free runner disk space
        if: runner.environment == 'github-hosted'
        run: |
          # hosted runners ship ~30G of toolchains this build never uses, images and the test stack need the space
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          tags: type=raw,value=${{ needs.release-please.outputs.version }}

      - name: Prepare magento paths
        run: |
          [ -d nginx/templates ] || { echo "::error::nginx/templates must be committed, fetch once with scripts/get_nginx_config.sh"; exit 1; }
          . ./.env
          sudo mkdir -p "${MAGENTO_ROOT_PATH}"/{releases/ci,shared/var/log,shared/var/tmp,shared/pub/media,public}
          sudo ln -sfn ../releases/ci "${MAGENTO_ROOT_PATH}/${CURRENT_SYMLINK}"
          sudo ln -sfn ../../shared/var "${MAGENTO_ROOT_PATH}/releases/ci/var"
          sudo chown -R "${DHI_STACK_UID}:${DHI_STACK_UID}" "${MAGENTO_ROOT_PATH}"
          sudo sysctl -w vm.max_map_count=262144

      - name: Fingerprint images, find the ones to build
        run: |
          registry="${IMAGE_REGISTRY}"
          . ./.env
          IMAGE_REGISTRY="${registry}"
          images="$RUNNER_TEMP/docker-compose.images.yml"
          build=()
          pull=()
          echo "services:" > "${images}"
          # a failing script must fail this step, not leave the build list empty
          bash scripts/image_fingerprint.sh > "$RUNNER_TEMP/fingerprints.txt"
          [ -s "$RUNNER_TEMP/fingerprints.txt" ] || { echo "::error::no images fingerprinted"; exit 1; }
          while read -r svc fingerprint; do
            ref="${IMAGE_REGISTRY}/${BRAND}-${svc}:${fingerprint}"
            printf '  %s:\n    image: %s\n' "${svc}" "${ref}" >> "${images}"
            echo "${svc} ${ref}" >> "$RUNNER_TEMP/images.txt"
            if docker manifest inspect "${ref}" >/dev/null 2>&1; then
              pull+=("${svc}")
            else
              build+=("${svc}")
            fi
          done < "$RUNNER_TEMP/fingerprints.txt"
          cat "${images}"
          echo "build: ${build[*]:-none}, reuse: ${pull[*]:-none}"
          {
            echo "BUILD_SERVICES=${build[*]}"
            echo "PULL_SERVICES=${pull[*]}"
            echo "COMPOSE_FILE=docker-compose.yml:docker-compose.ci.yml:${images}"
          } >> "$GITHUB_ENV"

      - name: Build changed images with bake
        if: env.BUILD_SERVICES != ''
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          registry="${IMAGE_REGISTRY}"
          set -a
          . ./.env
          . ./.env.secrets
          set +a
          IMAGE_REGISTRY="${registry}"
          read -ra targets <<< "${BUILD_SERVICES}"
          args=()
          while IFS= read -r label; do
            [ -n "${label}" ] && args+=(--set "*.labels.${label}")
          done <<< "${LABELS}"
          for target in "${targets[@]}"; do
            cache="${IMAGE_REGISTRY}/${BRAND}-${target}:buildcache"
            # the opensearch build stage holds the root CA key, cache only the final image layers
            mode=max
            [ "${target}" = opensearch ] && mode=min
            args+=(--set "${target}.cache-from=type=registry,ref=${cache}")
            args+=(--set "${target}.cache-to=type=registry,ref=${cache},mode=${mode}")
          done
          docker buildx bake -f docker-compose.yml -f "$RUNNER_TEMP/docker-compose.images.yml" \
            --load "${args[@]}" "${targets[@]}"
          # images are loaded into docker and the cache is in the registry, drop the builder copy
          docker buildx prune -af
          df -h /

      - name: Pull unchanged images
        if: env.PULL_SERVICES != ''
        run: |
          read -ra services <<< "${PULL_SERVICES}"
          docker compose pull "${services[@]}"

      - name: Start stack and wait for health checks
        run: |
          mapfile -t services < <(docker compose config --services | grep -vx magento)
          docker compose up -d --no-build --wait --wait-timeout 600 "${services[@]}"

      - name: Smoke tests
        run: |
          . ./.env
          for svc in php magento; do
            modules=$(docker compose run --rm --no-deps --entrypoint php "${svc}" -m)
            for ext in ${PHP_EXTENSION} redis igbinary lz4; do
              grep -qix "${ext}" <<< "${modules}" || { echo "::error::${svc}: php extension ${ext} not loaded"; exit 1; }
            done
          done
          docker compose run --rm --no-deps --entrypoint php magento /usr/local/bin/composer --version
          docker compose exec -T nginx nginx -t
          docker compose ps

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200
          # last health check results, unhealthy is otherwise silent
          for id in $(docker compose ps -aq); do
            docker inspect --format '{{.Name}} {{if .State.Health}}{{.State.Health.Status}} {{json .State.Health.Log}}{{end}}' "${id}"
          done

      - name: Stop stack
        if: always()
        run: docker compose down -v || true

      - name: Push changed images
        if: env.BUILD_SERVICES != ''
        run: |
          read -ra services <<< "${BUILD_SERVICES}"
          docker compose push "${services[@]}"

      - name: Tag all images with the release version
        run: |
          # alias tag for people browsing ghcr.io, same digest as the fingerprint tag, no rebuild
          # deploys still pin by digest from docker-compose.release.yml
          while read -r _ ref; do
            docker buildx imagetools create -t "${ref%:*}:${IMAGE_TAG}" "${ref}"
          done < "$RUNNER_TEMP/images.txt"

      - name: Attach image digest lock file to the draft release
        run: |
          {
            echo "# ${TAG_NAME} images pinned by digest"
            echo "# docker compose -f docker-compose.yml -f docker-compose.release.yml pull"
            echo "services:"
            while read -r svc ref; do
              digest=$(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest}}' | jq -r .digest)
              echo "  ${svc}:"
              echo "    image: ${ref%:*}@${digest}"
            done < "$RUNNER_TEMP/images.txt"
          } > docker-compose.release.yml
          cat docker-compose.release.yml
          gh release upload "${TAG_NAME}" docker-compose.release.yml --clobber --repo "${GITHUB_REPOSITORY}"

  publish:
    needs: [release-please, build]
    if: >-
      always() && needs.release-please.outputs.release_created == 'true'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "${TAG_NAME}" --draft=false --repo "${GITHUB_REPOSITORY}"
