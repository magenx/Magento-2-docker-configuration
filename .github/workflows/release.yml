name: release

# release-please opens a release PR from conventional commits. Merging it creates a draft release and tag,
# then images are built, tested and pushed to ghcr.io, their digests are attached to the release
# as docker-compose.release.yml and the release is published (immutable when release immutability is on).
#
# Build runs only in repos with variable BUILD_IMAGES=true. It needs:
#   - .env with the shop settings committed to the repo
#   - variable BUILD_RUNNER: runner with the server arch, default ubuntu-latest (amd64), ubuntu-24.04-arm for arm64
#   - secrets DHI_USER, DHI_PAT: dhi.io login
#   - secret BUILD_SECRETS: lines from the server .env.secrets that are baked into images:
#     OPENSEARCH_ADMIN_PASSWORD, ADMIN_PATH, RABBITMQ_PATH, ADMINER_PATH, PROFILER
#   all other passwords are throwaway values generated for the test run

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && vars.BUILD_IMAGES == 'true'
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
    env:
      IMAGE_TAG: ${{ needs.release-please.outputs.version }}
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
      COMPOSE_ENV_FILES: .env,.env.secrets
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image registry
        run: echo "IMAGE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Prepare .env.secrets
        env:
          BUILD_SECRETS: ${{ secrets.BUILD_SECRETS }}
        run: |
          test -f .env || { echo "::error::.env with the shop settings must be committed"; exit 1; }
          printf '%s\n' "$BUILD_SECRETS" | grep -q '^OPENSEARCH_ADMIN_PASSWORD=' \
            || { echo "::error::BUILD_SECRETS must contain OPENSEARCH_ADMIN_PASSWORD"; exit 1; }
          cp .env.secrets.template .env.secrets
          bash scripts/random_generator.sh
          # replace the generated values that end up in images with the real ones
          printf '%s\n' "$BUILD_SECRETS" | grep -E '^[A-Z_]+=' > "$RUNNER_TEMP/build.secrets"
          while IFS= read -r line; do
            sed -i "/^${line%%=*}=/d" .env.secrets
          done < "$RUNNER_TEMP/build.secrets"
          cat "$RUNNER_TEMP/build.secrets" >> .env.secrets
          rm -f "$RUNNER_TEMP/build.secrets"

      - name: Login to dhi.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USER }}
          password: ${{ secrets.DHI_PAT }}

      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Refuse to overwrite released images
        run: |
          docker compose config --format json \
            | jq -r '.services | to_entries[] | select(.value.build) | "\(.key) \(.value.image)"' \
            > "$RUNNER_TEMP/images.txt"
          echo "SERVICES=$(cut -d' ' -f1 "$RUNNER_TEMP/images.txt" | xargs)" >> "$GITHUB_ENV"
          while read -r _ img; do
            if docker manifest inspect "${img}" >/dev/null 2>&1; then
              echo "::error::${img} already exists, release images are immutable"
              exit 1
            fi
          done < "$RUNNER_TEMP/images.txt"

      - name: Prepare nginx templates and magento paths
        run: |
          [ -d nginx/templates ] || bash scripts/get_nginx_config.sh
          . ./.env
          sudo mkdir -p "${MAGENTO_ROOT_PATH}"/{releases/ci,shared/var/log,shared/var/tmp,shared/pub/media,public}
          sudo ln -sfn ../releases/ci "${MAGENTO_ROOT_PATH}/${CURRENT_SYMLINK}"
          sudo ln -sfn ../../shared/var "${MAGENTO_ROOT_PATH}/releases/ci/var"
          sudo chown -R "${DHI_STACK_UID}:${DHI_STACK_UID}" "${MAGENTO_ROOT_PATH}"
          sudo sysctl -w vm.max_map_count=262144

      - name: Build images
        run: |
          read -ra services <<< "${SERVICES}"
          docker compose build "${services[@]}"

      - name: Start stack and wait for health checks
        run: |
          mapfile -t services < <(docker compose config --services | grep -vx magento)
          docker compose up -d --wait --wait-timeout 600 "${services[@]}"

      - name: Smoke tests
        run: |
          . ./.env
          for svc in php magento; do
            modules=$(docker compose run --rm --no-deps --entrypoint php "${svc}" -m)
            for ext in ${PHP_EXTENSION} redis igbinary lz4; do
              grep -qix "${ext}" <<< "${modules}" || { echo "::error::${svc}: php extension ${ext} not loaded"; exit 1; }
            done
          done
          docker compose run --rm --no-deps --entrypoint php magento /usr/local/bin/composer --version
          docker compose exec -T nginx nginx -t
          docker compose ps

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Stop stack
        if: always()
        run: docker compose down -v || true

      - name: Push images
        run: |
          read -ra services <<< "${SERVICES}"
          docker compose push "${services[@]}"

      - name: Attach image digest lock file to the draft release
        run: |
          {
            echo "# ${TAG_NAME} images pinned by digest"
            echo "# docker compose -f docker-compose.yml -f docker-compose.release.yml pull"
            echo "services:"
            while read -r svc img; do
              digest=$(docker buildx imagetools inspect "${img}" --format '{{json .Manifest}}' | jq -r .digest)
              echo "  ${svc}:"
              echo "    image: ${img%:*}@${digest}"
            done < "$RUNNER_TEMP/images.txt"
          } > docker-compose.release.yml
          cat docker-compose.release.yml
          gh release upload "${TAG_NAME}" docker-compose.release.yml --clobber --repo "${GITHUB_REPOSITORY}"

  publish:
    needs: [release-please, build]
    if: >-
      always() && needs.release-please.outputs.release_created == 'true'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "${TAG_NAME}" --draft=false --repo "${GITHUB_REPOSITORY}"
