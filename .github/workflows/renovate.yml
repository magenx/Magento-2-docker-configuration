name: renovate
 
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
 
permissions: {}
 
concurrency:
  group: renovate
  cancel-in-progress: false
 
jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: renovate
    steps:
      - uses: renovatebot/github-action@dcfba84a42d1b5d5e49bf131b1bf53511851a123 # v46.3.1
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          RENOVATE_CONFIG_FILE_NAMES: '[".github/renovate/config.json"]'
          RENOVATE_HOST_RULES: '[{"hostType":"docker","matchHost":"dhi.io","username":"${{ secrets.DHI_USER }}","password":"${{ secrets.DHI_PAT }}"}]'
          LOG_LEVEL: info
