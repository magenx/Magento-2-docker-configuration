;; Adminer (MySQL/MariaDB only): one small pool on :9000 for the private admin vhost (nginx:8081, /mariadb/)
[adminer]
listen = 9000
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 60s
pm.max_requests = 200
;; workers get no environment: no stack secret is visible to Adminer, it logs in with the form's credentials only
clear_env = yes
catch_workers_output = yes
decorate_workers_output = no
;;
php_admin_flag[expose_php] = Off
php_admin_flag[display_errors] = Off
php_admin_flag[log_errors] = On
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300
php_admin_value[post_max_size] = 64M
php_admin_value[upload_max_filesize] = 64M
php_admin_value[date.timezone] = "${TIMEZONE}"
;; sessions and uploads on the /tmp tmpfs, the rest of the filesystem is read-only
php_admin_value[session.save_path] = /tmp
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[sys_temp_dir] = /tmp
php_admin_flag[session.cookie_httponly] = On
php_admin_value[session.cookie_samesite] = Strict
php_admin_value[open_basedir] = /var/www/adminer:/tmp
php_admin_value[disable_functions] = exec, shell_exec, system, passthru, popen, proc_open, pcntl_exec, phpinfo, show_source
